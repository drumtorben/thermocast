<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thermocast Panel Dev</title>
    <style>
      body {
        margin: 0;
        font-family: Roboto, system-ui, sans-serif;
      }
      body.dark {
        --primary-background-color: #111111;
        --secondary-background-color: #282828;
        --card-background-color: #1c1c1c;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --divider-color: #3a3a3a;
      }
      .devbar {
        position: fixed;
        right: 8px;
        top: 8px;
        z-index: 10;
        background: #ffffffcc;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="devbar">
      <label><input type="checkbox" id="dark" /> dark</label>
      <a href="?lang=de">de</a> · <a href="?lang=en">en</a>
    </div>
    <script type="module">
      import "../thermocast-panel.js";
      const params = new URLSearchParams(location.search);
      if (params.has("tab")) localStorage.setItem("thermocast.tab", params.get("tab"));
      if (params.get("why") === "1") localStorage.setItem("thermocast.why", JSON.stringify({ zone_eg: true }));
      const view = await (await fetch("./" + (params.get("src") || "sample-view.json"))).json();
      const el = document.createElement("thermocast-panel");
      el.hass = { locale: { language: params.get("lang") || "de" }, config: { time_zone: "Europe/Berlin" } };
      el.demoView = view;
      const load = async (f) => (await fetch("./" + f)).json();
      el.demoResponses = {
        "thermocast/model": await load("sample-model.json"),
        "thermocast/kpis": await load("sample-kpis.json"),
        "thermocast/export": { note: "dev page – no export" },
      };
      document.body.append(el);
      const dark = document.getElementById("dark");
      dark.checked = params.get("dark") === "1";
      document.body.classList.toggle("dark", dark.checked);
      dark.onchange = (e) => document.body.classList.toggle("dark", e.target.checked);
      if (params.has("hover")) {
        await el.updateComplete;
        el._hoverIndex = Number(params.get("hover"));
      }
      if (params.has("cand")) {
        await el.updateComplete;
        el._hoverCandidate = Number(params.get("cand"));
      }
    </script>
  </body>
</html>
