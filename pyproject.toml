[project]
name = "thermocast"
version = "0.4.3"
description = "Predictive heating release for Home Assistant with online-learned room models"
requires-python = ">=3.14.2"  # same as current Home Assistant
license = "MIT"
# runtime deps of the integration itself (keep in sync with manifest.json "requirements")
dependencies = ["numpy>=1.26"]

[dependency-groups]
dev = [
    # pins a matching homeassistant + pytest/pytest-asyncio
    "pytest-homeassistant-custom-component",
    # stay on a stable HA release (newest plugin versions track betas)
    "homeassistant>=2026.9,<2026.10",
    # HA installs this at runtime; without it in the lock, `uv sync` removes it and every test that loads
    # `frontend`/`panel_custom` fails. Keep in sync with homeassistant/components/frontend/manifest.json.
    "home-assistant-frontend==20260826.7",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py314"
